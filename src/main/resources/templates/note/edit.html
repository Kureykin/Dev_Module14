<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit</title>
</head>
<body>
    <div>
        <form th:each = "note:${note}" action="updatedNote" method="post">
            <input type="text" name = "id" th:value = "${note.getId}" readonly>
            <input type = "text" name = "title" th:value="${note.getTitle}">
            <div>
                <input type = "text" name = "content" th:value="${note.getContent}">
            </div>
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
